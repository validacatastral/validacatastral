<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ValidaCatastral</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{--mono:'IBM Plex Mono',ui-monospace,monospace;--head:'Inter',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;}
html[data-theme="dark"]{--bg-void:#0b0b0c;--bg-deep:#111113;--bg-panel:#151517;--bg-card:#1b1b1e;--border:#2a2a2e;--cyan:#5dcaa5;--blue:#3fae89;--green:#5dcaa5;--amber:#e2b35c;--red:#e07b7b;--purple:#a79bef;--text:#ededee;--mute:#9a9aa0;--dim:#6e6e74;--zebra:rgba(255,255,255,0.02);--acc-soft:rgba(93,202,165,0.10);--acc-bord:rgba(93,202,165,0.38);--hov-soft:rgba(93,202,165,0.06);--amb-soft:rgba(226,179,92,0.10);--amb-bord:rgba(226,179,92,0.38);--shadow:0 8px 32px rgba(0,0,0,0.5);}
html[data-theme="light"]{--bg-void:#fafafa;--bg-deep:#f1f1f2;--bg-panel:#ffffff;--bg-card:#f5f5f6;--border:#e3e3e6;--cyan:#0f6e56;--blue:#128a68;--green:#0f6e56;--amber:#925f0e;--red:#b54a4a;--purple:#5f51c9;--text:#19191b;--mute:#65656c;--dim:#9a9aa0;--zebra:rgba(0,0,0,0.022);--acc-soft:rgba(15,110,86,0.08);--acc-bord:rgba(15,110,86,0.35);--hov-soft:rgba(15,110,86,0.05);--amb-soft:rgba(146,95,14,0.08);--amb-bord:rgba(146,95,14,0.35);--shadow:0 8px 32px rgba(0,0,0,0.12);}
*{margin:0;padding:0;box-sizing:border-box;}
html{background:var(--bg-void);}
body{background:var(--bg-void);color:var(--text);font-family:var(--body);min-height:100vh;display:flex;flex-direction:column;transition:background 0.2s ease,color 0.2s ease;}
.topbar{background:var(--bg-panel);border-bottom:1px solid var(--border);padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:10px;}
.logo{font-family:var(--head);font-size:15px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px;white-space:nowrap;}
.logo::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--cyan);flex-shrink:0;}
.logo small{color:var(--mute);font-size:11px;font-weight:400;}
.tr{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:11px;color:var(--mute);}
.clk{color:var(--mute);font-size:12px;}
.online{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:20px;padding:3px 10px;color:var(--green);}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}
.pbadge{background:var(--acc-soft);border:1px solid var(--acc-bord);color:var(--cyan);font-size:10px;padding:2px 9px;border-radius:10px;font-family:var(--head);font-weight:500;}
.tbtn{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:var(--bg-card);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:border-color 0.15s;padding:0;}
.tbtn:hover{border-color:var(--cyan);}
.tbtn svg{width:15px;height:15px;display:block;}
.ic-sun{display:none;}
html[data-theme="dark"] .ic-sun{display:block;}
html[data-theme="dark"] .ic-moon{display:none;}
.main{flex:1;padding:20px;max-width:1500px;width:100%;margin:0 auto;}
.ph{margin-bottom:18px;}
.ph h1{font-family:var(--head);font-size:21px;font-weight:600;margin-bottom:3px;}
.ph h1 span{color:var(--cyan);}
.ph p{color:var(--mute);font-size:13px;}
.card{background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px;}
.ct{font-family:var(--head);font-size:11px;font-weight:500;letter-spacing:0.07em;color:var(--mute);text-transform:uppercase;margin-bottom:12px;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;}
.tab{padding:7px 16px;border-radius:20px;border:1px solid var(--border);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--head);color:var(--mute);background:var(--bg-card);transition:all 0.15s;}
.tab:hover{border-color:var(--cyan);color:var(--text);}
.tab.active{background:var(--acc-soft);border-color:var(--acc-bord);color:var(--cyan);}
.tab.dist.active{background:var(--acc-soft);border-color:var(--acc-bord);color:var(--cyan);}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;}
.sb{flex:1;min-width:180px;position:relative;}
.sb input{width:100%;background:var(--bg-deep);border:1px solid var(--border);color:var(--text);padding:8px 12px 8px 32px;border-radius:8px;font-family:var(--body);font-size:13px;outline:none;transition:border-color 0.15s;}
.sb input:focus{border-color:var(--cyan);}
.sb input::placeholder{color:var(--dim);}
.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--dim);display:flex;}
.si svg{width:14px;height:14px;}
.btn{padding:8px 14px;border-radius:8px;border:1px solid;font-family:var(--head);font-size:13px;font-weight:500;cursor:pointer;transition:all 0.15s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
.bg{background:var(--acc-soft);border-color:var(--acc-bord);color:var(--cyan);}
.bg:hover{border-color:var(--cyan);}
.ba{background:transparent;border-color:var(--border);color:var(--mute);}
.ba:hover{border-color:var(--amb-bord);color:var(--amber);}
.ri{font-family:var(--mono);font-size:11px;color:var(--mute);padding:2px 0 8px;}
.af{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--amb-soft);border:1px solid var(--amb-bord);color:var(--amber);font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:10px;}
.chip button{background:none;border:none;color:var(--red);cursor:pointer;font-size:11px;line-height:1;padding:0;}
.tw{overflow-x:auto;border-radius:10px;border:1px solid var(--border);max-height:560px;overflow-y:auto;position:relative;background:var(--bg-panel);}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead{background:var(--bg-deep);position:sticky;top:0;z-index:20;}
th{text-align:left;font-family:var(--head);font-size:11px;font-weight:500;color:var(--mute);letter-spacing:0.05em;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap;position:relative;}
.thb{display:flex;align-items:center;gap:4px;padding:10px;cursor:pointer;user-select:none;transition:color 0.15s;}
.thb:hover{color:var(--cyan);}
.thb.fil{color:var(--amber);}
.fdd{position:absolute;top:100%;left:0;min-width:220px;max-width:300px;background:var(--bg-panel);border:1px solid var(--acc-bord);border-radius:10px;box-shadow:var(--shadow);z-index:1000;overflow:hidden;}
.fdh{padding:10px 12px 6px;border-bottom:1px solid var(--border);}
.fds{width:100%;background:var(--bg-deep);border:1px solid var(--border);color:var(--text);padding:6px 9px;border-radius:6px;font-family:var(--body);font-size:12px;outline:none;margin-bottom:6px;}
.fds:focus{border-color:var(--cyan);}
.fdsa{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--mute);padding:3px 0;cursor:pointer;user-select:none;}
.fdl{max-height:200px;overflow-y:auto;padding:4px 0;}
.fdl::-webkit-scrollbar{width:4px;}
.fdl::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.fdi{display:flex;align-items:center;gap:7px;padding:5px 12px;cursor:pointer;font-size:12px;transition:background 0.1s;user-select:none;}
.fdi:hover{background:var(--hov-soft);}
.fdi input{accent-color:var(--cyan);width:13px;height:13px;flex-shrink:0;cursor:pointer;}
.fdi span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;}
.fdf{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--border);background:var(--bg-deep);}
.fdb{flex:1;padding:6px;border-radius:6px;border:1px solid;font-family:var(--head);font-size:12px;font-weight:500;cursor:pointer;text-align:center;}
.fdbok{background:var(--acc-soft);border-color:var(--acc-bord);color:var(--cyan);}
.fdbok:hover{border-color:var(--cyan);}
.fdbca{background:none;border-color:var(--border);color:var(--mute);}
td{padding:8px 10px;color:var(--text);border-bottom:1px solid var(--border);white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;}
tr:nth-child(even) td{background:var(--zebra);}
tr:hover td{background:var(--hov-soft);}
.sc{white-space:nowrap;vertical-align:top;padding-top:9px;min-width:185px;}
.sbs{display:flex;gap:4px;align-items:center;margin-bottom:3px;}
.bch{padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--mute);font-family:var(--head);font-size:11px;font-weight:500;cursor:pointer;transition:all 0.15s;}
.bch:hover{background:var(--acc-soft);border-color:var(--acc-bord);color:var(--cyan);}
.bch.done{background:var(--acc-soft);border-color:var(--acc-bord);color:var(--cyan);cursor:default;}
.bcm{padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--mute);font-family:var(--head);font-size:11px;font-weight:500;cursor:pointer;transition:all 0.15s;}
.bcm:hover{border-color:var(--acc-bord);color:var(--cyan);}
.bcm.has{border-color:var(--amb-bord);color:var(--amber);background:var(--amb-soft);}
.cp{font-family:var(--body);font-size:11px;color:var(--amber);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pag{display:flex;align-items:center;gap:6px;justify-content:space-between;margin-top:10px;font-family:var(--mono);font-size:11px;color:var(--mute);flex-wrap:wrap;}
.pbs{display:flex;gap:4px;flex-wrap:wrap;}
.pb{padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg-card);color:var(--mute);cursor:pointer;font-family:var(--mono);font-size:11px;transition:all 0.15s;}
.pb:hover,.pb.cur{border-color:var(--acc-bord);color:var(--cyan);background:var(--acc-soft);}
.mo{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:2000;display:flex;align-items:center;justify-content:center;}
.mb{background:var(--bg-panel);border:1px solid var(--border);border-radius:14px;padding:24px;width:400px;max-width:92vw;box-shadow:var(--shadow);}
.mt{font-family:var(--head);font-size:16px;font-weight:600;margin-bottom:4px;}
.ms{font-family:var(--mono);font-size:11px;color:var(--mute);margin-bottom:14px;}
.ml{font-size:11px;color:var(--mute);letter-spacing:0.05em;text-transform:uppercase;margin-bottom:5px;display:block;font-weight:500;font-family:var(--head);}
textarea{background:var(--bg-deep);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:8px;font-family:var(--body);font-size:13px;outline:none;width:100%;height:80px;resize:vertical;margin-bottom:12px;}
textarea:focus{border-color:var(--cyan);}
.ma{display:flex;gap:8px;justify-content:flex-end;}
.bca{padding:7px 14px;border-radius:7px;border:1px solid var(--border);background:none;color:var(--mute);font-family:var(--head);font-size:12px;font-weight:500;cursor:pointer;}
.bcg{padding:7px 14px;border-radius:7px;border:1px solid var(--acc-bord);background:var(--acc-soft);color:var(--cyan);font-family:var(--head);font-size:12px;font-weight:600;cursor:pointer;}
.bcb{padding:7px 14px;border-radius:7px;border:1px solid var(--acc-bord);background:var(--acc-soft);color:var(--cyan);font-family:var(--head);font-size:12px;font-weight:600;cursor:pointer;}
.empty{text-align:center;padding:40px;color:var(--dim);font-size:13px;}
.ld{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;color:var(--mute);padding:20px;}
.sp{width:15px;height:15px;border:2px solid var(--border);border-top-color:var(--cyan);border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:20px;right:20px;z-index:9998;display:flex;flex-direction:column;gap:6px;}
.tm{background:var(--bg-panel);border:1px solid var(--cyan);color:var(--text);padding:9px 14px;border-radius:9px;font-size:12px;font-family:var(--body);box-shadow:var(--shadow);animation:sup 0.2s ease;max-width:280px;}
@keyframes sup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(max-width:640px){.main{padding:12px;}.topbar{padding:0 12px;}.clk{display:none;}.logo small{display:none;}}
</style>
<script>
(function(){var t=null;try{t=localStorage.getItem('vc-theme');}catch(e){}
if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';}
document.documentElement.setAttribute('data-theme',t);
window.toggleTheme=function(){var c=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',c);try{localStorage.setItem('vc-theme',c);}catch(e){}};
})();
</script>
</head>
<body>
<div class="topbar">
  <div class="logo">ValidaCatastral <small>Vista p&uacute;blica</small></div>
  <div class="tr">
    <span class="clk" id="clock">--:--:--</span>
    <div class="online"><div class="dot"></div><span id="uc">0</span>&nbsp;en l&iacute;nea</div>
    <span class="pbadge">P&uacute;blico</span>
    <button class="tbtn" onclick="toggleTheme()" aria-label="Cambiar tema claro u oscuro" title="Cambiar tema">
      <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</div>
<main class="main">
  <div class="ph"><h1>Vista <span>p&uacute;blica</span></h1><p>Selecciona distrito y categor&iacute;a &middot; filtros por columna &middot; revisi&oacute;n en tiempo real</p></div>
  <div class="card"><div class="ct">Distritos</div><div class="tabs" id="distTabs"><div class="ld"><div class="sp"></div>Cargando...</div></div></div>
  <div class="card" id="catPanel" style="display:none;"><div class="ct">Categor&iacute;as &middot; <span id="distBC" style="color:var(--cyan);"></span></div><div class="tabs" id="catTabs"></div></div>
  <div class="card" id="tablePanel" style="display:none;">
    <div class="ct"><span id="tableTitle"></span></div>
    <div class="toolbar">
      <div class="sb"><span class="si"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span><input type="text" id="gsearch" placeholder="Buscar en todos los campos&hellip;" oninput="applyF()"></div>
      <button class="btn ba" onclick="clearF()">Limpiar filtros</button>
      <button class="btn bg" onclick="dlExcel()">Descargar Excel</button>
    </div>
    <div class="af" id="activeF"></div>
    <div class="ri" id="ri"></div>
    <div class="tw"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    <div class="pag" id="pag"></div>
  </div>
</main>
<div class="mo" id="mCheck" style="display:none;">
  <div class="mb">
    <div class="mt" style="color:var(--cyan);">Marcar revisado</div>
    <div class="ms" id="mCheckInfo"></div>
    <div style="font-size:12px;color:var(--mute);margin-bottom:16px;">&iquest;Confirmas que esta fila ha sido revisada?</div>
    <div class="ma"><button class="bca" onclick="closeM('mCheck')">Cancelar</button><button class="bcg" onclick="doCheck()">Confirmar</button></div>
  </div>
</div>
<div class="mo" id="mCmt" style="display:none;">
  <div class="mb">
    <div class="mt" style="color:var(--cyan);">Comentario</div>
    <div class="ms" id="mCmtInfo"></div>
    <span class="ml">Tu comentario</span>
    <textarea id="cmtTxt" placeholder="Escribe tu comentario&hellip;"></textarea>
    <div class="ma"><button class="bca" onclick="closeM('mCmt')">Cancelar</button><button class="bcb" onclick="doCmt()">Guardar</button></div>
  </div>
</div>
<div id="toast"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getFirestore,collection,onSnapshot,query,orderBy,doc,setDoc,deleteDoc,getDocs}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import{initializeAppCheck,ReCaptchaV3Provider}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check.js";
const cfg={apiKey:"AIzaSyBrTT-bK_UTZLSg6BVMiVviIQmAYFbGo9Q",authDomain:"dataforge-mio.firebaseapp.com",projectId:"dataforge-mio",storageBucket:"dataforge-mio.firebasestorage.app",messagingSenderId:"687282166437",appId:"1:687282166437:web:83772a6d56c52185784b4c"};
const app=initializeApp(cfg);
// App Check: protege Firestore para que solo esta web pueda escribir.
// La clave de sitio reCAPTCHA v3 es publica (puede ir en el repo).
const RECAPTCHA_SITE_KEY="6Le42RktAAAAAFZI91BJDPkLWMbgbB72eZjuID2J";
try{initializeAppCheck(app,{provider:new ReCaptchaV3Provider(RECAPTCHA_SITE_KEY),isTokenAutoRefreshEnabled:true});}catch(e){console.warn('appcheck',e);}
const db=getFirestore(app);
const auth=getAuth(app);
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
setInterval(tick,1000);tick();
var pid='pub_'+Math.random().toString(36).slice(2);
async function rP(){try{await setDoc(doc(db,'presence',pid),{type:'public',ts:Date.now()});}catch(e){}}
async function rmP(){try{await deleteDoc(doc(db,'presence',pid));}catch(e){}}
signInAnonymously(auth).then(rP).catch(function(e){console.warn('auth',e);});setInterval(rP,180000);window.addEventListener('beforeunload',rmP);
onSnapshot(collection(db,'presence'),function(sn){var cut=Date.now()-270000,c=0;sn.forEach(function(d){if((d.data().ts||0)>cut)c++;});document.getElementById('uc').textContent=c;});
var RPP=100;
var S={files:[],reviews:{},distritos:[],categorias:[],curDist:null,curType:null,page:1,sort:{col:-1,dir:1},cf:{},rows:[],headers:[]};
var pendKey=null,activeDD=null;
onSnapshot(doc(db,'config','settings'),function(sn){if(sn.exists()){var d=sn.data();S.distritos=d.distritos||[];S.categorias=d.categorias||[];}renderDistTabs();});
onSnapshot(query(collection(db,'excelFiles'),orderBy('date','desc')),function(sn){S.files=[];sn.forEach(function(d){S.files.push(Object.assign({},d.data(),{fireId:d.id}));});renderDistTabs();if(S.curType)ensureCurRows();});
onSnapshot(collection(db,'reviews'),function(sn){S.reviews={};sn.forEach(function(d){S.reviews[d.id]=d.data();});if(S.curType)renderTable();});

function getDistsCon(){var ds={};S.files.forEach(function(f){if(f.distrito)ds[f.distrito]=true;});return Object.keys(ds);}

function renderDistTabs(){
  var el=document.getElementById('distTabs');
  var dists=getDistsCon();
  if(!dists.length){el.innerHTML='<div class="empty">No hay datos disponibles aun.</div>';document.getElementById('catPanel').style.display='none';document.getElementById('tablePanel').style.display='none';return;}
  el.innerHTML='';
  dists.forEach(function(d){
    var t=document.createElement('div');
    t.className='tab dist'+(S.curDist===d?' active':'');
    t.textContent=d;
    t.onclick=function(){selDist(d);};
    el.appendChild(t);
  });
  if(!S.curDist||dists.indexOf(S.curDist)<0)selDist(dists[0]);
  else renderCatTabs();
}

window.selDist=function(d){
  S.curDist=d;S.curType=null;S.page=1;S.cf={};S.sort={col:-1,dir:1};
  var gs=document.getElementById('gsearch');if(gs)gs.value='';
  document.querySelectorAll('#distTabs .tab').forEach(function(t){t.classList.toggle('active',t.textContent===d);});
  document.getElementById('distBC').textContent=d;
  document.getElementById('catPanel').style.display='block';
  document.getElementById('tablePanel').style.display='none';
  renderCatTabs();
};

function renderCatTabs(){
  var el=document.getElementById('catTabs');
  var cats={};S.files.forEach(function(f){if(f.distrito===S.curDist&&f.type)cats[f.type]=true;});
  var catList=Object.keys(cats);
  if(!catList.length){el.innerHTML='<div style="font-family:var(--mono);font-size:11px;color:var(--dim);">Sin datos para este distrito.</div>';return;}
  el.innerHTML='';
  catList.forEach(function(c){
    var t=document.createElement('div');
    t.className='tab'+(S.curType===c?' active':'');
    t.textContent=c;
    t.onclick=function(){selCat(c);};
    el.appendChild(t);
  });
  if(!S.curType||catList.indexOf(S.curType)<0)selCat(catList[0]);
}

async function loadRowsFor(f){
  if(f.rows)return f.rows;
  if(f._rows)return f._rows;
  var sn2=await getDocs(query(collection(db,'excelFiles',f.fireId,'chunks'),orderBy('i')));
  var rows=[];sn2.forEach(function(d2){(d2.data().rows||[]).forEach(function(r){rows.push(r);});});
  f._rows=rows;return rows;
}
async function ensureCurRows(){
  var fs=S.files.filter(function(f){return f.distrito===S.curDist&&f.type===S.curType;});
  for(var i=0;i<fs.length;i++){try{await loadRowsFor(fs[i]);}catch(e){}}
  renderTable();
}
window.selCat=async function(type){
  S.curType=type;S.page=1;S.sort={col:-1,dir:1};S.cf={};
  var gs=document.getElementById('gsearch');if(gs)gs.value='';
  document.getElementById('tableTitle').textContent=S.curDist+' - '+type;
  document.querySelectorAll('#catTabs .tab').forEach(function(t){t.classList.toggle('active',t.textContent===type);});
  document.getElementById('tablePanel').style.display='block';
  document.getElementById('tbody').innerHTML='<tr><td colspan="99"><div class="ld"><div class="sp"></div>Cargando datos...</div></td></tr>';
  await ensureCurRows();
};

function buildData(){
  var fs=S.files.filter(function(f){return f.distrito===S.curDist&&f.type===S.curType;});
  S.headers=[];S.rows=[];
  fs.forEach(function(f){if(!S.headers.length)S.headers=f.headers||[];(f._rows||f.rows||[]).forEach(function(r){S.rows.push(r);});});
}

function getFiltered(){
  var rows=S.rows.slice();
  var gs=document.getElementById('gsearch');var srch=gs?gs.value.toLowerCase():'';
  if(srch)rows=rows.filter(function(r){return S.headers.some(function(h){return String(r[h]||'').toLowerCase().indexOf(srch)>=0;});});
  Object.keys(S.cf).forEach(function(h){var f=S.cf[h];if(f&&f.size>0)rows=rows.filter(function(r){return f.has(String(r[h]!=null?r[h]:''));});});
  if(S.sort.col>=0){var sh=S.headers[S.sort.col],sd=S.sort.dir;rows.sort(function(a,b){var va=a[sh]!=null?a[sh]:'',vb=b[sh]!=null?b[sh]:'';if(typeof va==='number'&&typeof vb==='number')return(va-vb)*sd;return String(va).localeCompare(String(vb))*sd;});}
  return rows;
}

function getColVals(h){var v={};S.rows.forEach(function(r){v[String(r[h]!=null?r[h]:'')]=true;});return Object.keys(v).sort(function(a,b){return a.localeCompare(b,undefined,{numeric:true});});}

window.applyF=function(){S.page=1;renderTable();};
window.clearF=function(){S.cf={};S.sort={col:-1,dir:1};var gs=document.getElementById('gsearch');if(gs)gs.value='';closeDD();S.page=1;renderTable();};

function renderAF(){
  var el=document.getElementById('activeF');el.innerHTML='';
  Object.keys(S.cf).forEach(function(h){
    var f=S.cf[h];if(f&&f.size>0){
      var chip=document.createElement('div');chip.className='chip';
      chip.innerHTML='<span>'+eh(h)+': '+(f.size===1?[...f][0]:f.size+' valores')+'</span>';
      var btn=document.createElement('button');btn.textContent='x';
      btn.onclick=(function(hdr){return function(){delete S.cf[hdr];S.page=1;renderTable();};})(h);
      chip.appendChild(btn);el.appendChild(chip);
    }
  });
}

function renderTable(){
  if(!S.curType)return;
  buildData();
  var filtered=getFiltered();
  var pages=Math.ceil(filtered.length/RPP)||1;
  if(S.page>pages)S.page=1;
  var pageRows=filtered.slice((S.page-1)*RPP,S.page*RPP);
  document.getElementById('ri').textContent=filtered.length+' de '+S.rows.length+' filas';
  renderAF();
  var tk=S.curDist+'_'+S.curType;
  // THEAD
  var thead=document.getElementById('thead');thead.innerHTML='';
  var tr=document.createElement('tr');
  var th0=document.createElement('th');th0.innerHTML='<div class="thb" style="cursor:default;min-width:160px;">ESTADO</div>';tr.appendChild(th0);
  S.headers.forEach(function(h,i){
    var th=document.createElement('th');
    var isF=S.cf[h]&&S.cf[h].size>0;
    var arr=S.sort.col===i?(S.sort.dir===1?'▲':'▼'):'';
    var btn=document.createElement('div');btn.className='thb'+(isF?' fil':'');
    btn.innerHTML=eh(h)+(arr?'<span style="font-size:9px;">'+arr+'</span>':'')+'<span style="font-size:10px;">&#9660;</span>';
    btn.onclick=(function(ci,hdr){return function(e){e.stopPropagation();toggleDD(e,ci,hdr);};})(i,h);
    th.appendChild(btn);tr.appendChild(th);
  });
  thead.appendChild(tr);
  // TBODY
  var tbody=document.getElementById('tbody');tbody.innerHTML='';
  if(!pageRows.length){var tr2=document.createElement('tr');var td0=document.createElement('td');td0.colSpan=S.headers.length+1;td0.className='empty';td0.textContent='Sin resultados';tr2.appendChild(td0);tbody.appendChild(tr2);renderPag(pages,filtered.length);return;}
  pageRows.forEach(function(r){
    var rk=makeKey(tk,r,S.headers);var rev=S.reviews[rk];var done=rev&&rev.done;var hasCom=rev&&rev.comment&&rev.comment.trim();
    var row=document.createElement('tr');
    var sc=document.createElement('td');sc.className='sc';
    var sbs=document.createElement('div');sbs.className='sbs';
    var bch=document.createElement('button');bch.className='bch'+(done?' done':'');bch.textContent=done?'✓ Revisado':'Revisar';
    if(done)bch.disabled=true;
    else bch.onclick=(function(k,v){return function(){openCheck(k,v);};})(rk,String(r[S.headers[0]]||''));
    sbs.appendChild(bch);
    var bcm=document.createElement('button');bcm.className='bcm'+(hasCom?' has':'');bcm.textContent=hasCom?'✎ Editar':'✎ Comentar';
    bcm.onclick=(function(k,v){return function(){openCmt(k,v);};})(rk,String(r[S.headers[0]]||''));
    sbs.appendChild(bcm);sc.appendChild(sbs);
    if(hasCom){var cp=document.createElement('div');cp.className='cp';cp.textContent=rev.comment;sc.appendChild(cp);}
    row.appendChild(sc);
    S.headers.forEach(function(h){var td=document.createElement('td');td.title=String(r[h]!=null?r[h]:'');td.textContent=String(r[h]!=null?r[h]:'');row.appendChild(td);});
    tbody.appendChild(row);
  });
  renderPag(pages,filtered.length);
}

function renderPag(pages,total){
  var el=document.getElementById('pag'),cur=S.page;
  if(pages<=1){el.innerHTML='<span>'+total+' filas</span>';return;}
  var html='<span>'+total+' filas</span><div class="pbs">';
  html+='<button class="pb" onclick="goP('+(cur-1)+')"'+(cur<=1?' disabled':'')+'>&#8249;</button>';
  for(var i=1;i<=pages;i++){if(pages>8&&i>2&&i<pages-1&&Math.abs(i-cur)>1){if(i===3||i===pages-2)html+='<span style="color:var(--dim);padding:0 3px;">...</span>';continue;}html+='<button class="pb'+(i===cur?' cur':'')+'" onclick="goP('+i+')">'+i+'</button>';}
  html+='<button class="pb" onclick="goP('+(cur+1)+')"'+(cur>=pages?' disabled':'')+'>&#8250;</button></div>';
  el.innerHTML=html;
}
window.goP=function(n){S.page=n;renderTable();};

// DROPDOWN
function toggleDD(e,ci,hdr){
  if(activeDD&&activeDD.col===ci){closeDD();return;}closeDD();
  var th=e.currentTarget.closest('th');
  var allVals=getColVals(hdr);var cur=S.cf[hdr]||null;var pending=cur?new Set(cur):new Set(allVals);
  var dd=document.createElement('div');dd.className='fdd';dd.id='theDD';
  var dh=document.createElement('div');dh.className='fdh';
  var si=document.createElement('input');si.className='fds';si.placeholder='Buscar valor...';
  si.oninput=function(){var q=si.value.toLowerCase();var fv=allVals.filter(function(v){return v.toLowerCase().indexOf(q)>=0;});renderFDList(fv,pending,ci,allChk,fl);};
  var sa=document.createElement('label');sa.className='fdsa';
  var allChk=document.createElement('input');allChk.type='checkbox';allChk.checked=pending.size===allVals.length;
  var sal=document.createElement('span');sal.textContent='(Seleccionar todo)';
  sa.onclick=function(ev){ev.preventDefault();allChk.checked=!allChk.checked;if(allChk.checked)allVals.forEach(function(v){pending.add(v);});else pending.clear();renderFDList(allVals,pending,ci,allChk,fl);};
  sa.appendChild(allChk);sa.appendChild(sal);dh.appendChild(si);dh.appendChild(sa);dd.appendChild(dh);
  var fl=document.createElement('div');fl.className='fdl';renderFDList(allVals,pending,ci,allChk,fl);dd.appendChild(fl);
  var df=document.createElement('div');df.className='fdf';
  var ok=document.createElement('button');ok.className='fdb fdbok';ok.textContent='ACEPTAR';
  ok.onclick=function(){if(pending.size===0||pending.size===allVals.length)delete S.cf[hdr];else S.cf[hdr]=new Set(pending);closeDD();S.page=1;renderTable();};
  var ca=document.createElement('button');ca.className='fdb fdbca';ca.textContent='Cancelar';ca.onclick=closeDD;
  df.appendChild(ok);df.appendChild(ca);dd.appendChild(df);
  th.style.position='relative';th.appendChild(dd);
  activeDD={col:ci};si.focus();
}
function renderFDList(vals,pending,ci,allChk,el){
  el.innerHTML='';
  vals.forEach(function(v){
    var item=document.createElement('label');item.className='fdi';
    var cb=document.createElement('input');cb.type='checkbox';cb.checked=pending.has(v);
    cb.onchange=function(){if(cb.checked)pending.add(v);else pending.delete(v);if(allChk)allChk.checked=pending.size===vals.length;};
    var sp=document.createElement('span');sp.textContent=v||'(vacio)';
    item.appendChild(cb);item.appendChild(sp);el.appendChild(item);
  });
}
function closeDD(){var dd=document.getElementById('theDD');if(dd)dd.remove();activeDD=null;}
document.addEventListener('click',function(e){if(activeDD&&!e.target.closest('#theDD')&&!e.target.closest('.thb'))closeDD();});

// MODALS
window.openCheck=function(rk,info){pendKey=rk;document.getElementById('mCheckInfo').textContent='Fila: '+info;document.getElementById('mCheck').style.display='flex';};
window.openCmt=function(rk,info){pendKey=rk;var rev=S.reviews[rk];document.getElementById('mCmtInfo').textContent='Fila: '+info;document.getElementById('cmtTxt').value=rev&&rev.comment?rev.comment:'';document.getElementById('mCmt').style.display='flex';setTimeout(function(){document.getElementById('cmtTxt').focus();},100);};
window.closeM=function(id){document.getElementById(id).style.display='none';pendKey=null;};
window.doCheck=async function(){if(!pendKey)return;var rk=pendKey,ex=S.reviews[rk]||{};try{await setDoc(doc(db,'reviews',rk),Object.assign({},ex,{done:true,doneDate:new Date().toISOString(),tipo:S.curType,distrito:S.curDist,doneBy:'publico'}));toast('Marcado como revisado','var(--green)');closeM('mCheck');}catch(e){toast('Error: '+e.message,'var(--red)');}};
window.doCmt=async function(){if(!pendKey)return;var rk=pendKey,comment=document.getElementById('cmtTxt').value.trim(),ex=S.reviews[rk]||{};try{await setDoc(doc(db,'reviews',rk),Object.assign({},ex,{comment:comment,commentDate:new Date().toISOString(),type:S.curType,distrito:S.curDist}));toast(comment?'Comentario guardado':'Comentario eliminado','var(--amber)');closeM('mCmt');}catch(e){toast('Error: '+e.message,'var(--red)');}};
['mCheck','mCmt'].forEach(function(id){document.getElementById(id).addEventListener('click',function(e){if(e.target===this)closeM(id);});});

// DOWNLOAD
window.dlExcel=function(){
  if(!S.curType)return;var rows=getFiltered();var tk=S.curDist+'_'+S.curType;
  var wsData=[['DISTRITO','CATEGORIA','REVISADO','COMENTARIO'].concat(S.headers)].concat(rows.map(function(r){var rk=makeKey(tk,r,S.headers);var rev=S.reviews[rk];return[S.curDist,S.curType,(rev&&rev.done?'Si':'No'),(rev&&rev.comment?rev.comment:'')].concat(S.headers.map(function(h){return r[h]!=null?r[h]:'';  }));}));
  var ws=XLSX.utils.aoa_to_sheet(wsData);var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,S.curType.slice(0,31));
  XLSX.writeFile(wb,tk.replace(/\s+/g,'_')+'_datos.xlsx');toast('Descargando...','var(--green)');
};

function makeKey(tk,row,headers){var k=(tk+'__'+headers.slice(0,3).map(function(h){return String(row[h]!=null?row[h]:'');}).join('_')).replace(/[^a-zA-Z0-9_-]/g,'').slice(0,100);return k||('row_'+Math.random().toString(36).slice(2));}
function eh(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
window.toast=function(msg,color){var d=document.createElement('div');d.className='tm';d.style.borderColor=color||'var(--blue)';d.textContent=msg;document.getElementById('toast').appendChild(d);setTimeout(function(){d.remove();},4000);};
</script>
